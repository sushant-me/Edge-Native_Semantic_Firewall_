# Falsifies the three reproducibility claims the paper makes about its own
# artifacts, on every push and weekly:
#
#   1. data/corpus.jsonl is exactly what src/corpus.py writes from SEED=42.
#      Ground-truth labels follow from the policy by construction, so the
#      committed corpus must be regenerable — not merely asserted to be.
#
#   2. results/metrics.json is exactly what src/analyze.py derives from the
#      committed results/*.jsonl.
#
#   3. Every manuscript macro is derived from those metrics, except the recorded
#      hardware measurements declared in KNOWN_RECORDED_MACROS. A new constant
#      fails the build rather than slipping into the paper unexamined.
#
# The 3,000 model generations are committed under results/, so the checks run
# on a stock runner with no GPU and no model download.
name: reproducibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches drift from a dependency or Python-version change rather
    # than from an edit to this repository.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          # Only the analysis step needs these; the corpus generator is
          # standard library only, which is why it can be checked on its own.
          python -m pip install "matplotlib>=3.8"

      - name: Corpus reproduces from the committed seed
        run: python src/verify_reproducibility.py --only corpus

      - name: Reported metrics reproduce from the committed raw outputs
        run: python src/verify_reproducibility.py --only metrics

      - name: No undeclared constants in the manuscript macros
        run: python src/verify_reproducibility.py --only macros

      - name: All checks together (what `make verify` runs)
        run: make verify

      - name: The figure pipeline still works when matplotlib is present
        # `make verify` now passes --no-figs, so nothing above exercises the
        # plotting path any more. Without this step the figure code could break
        # silently: it is the half of analyze.py that the paper depends on.
        run: |
          python src/analyze.py \
            --results results/results_p1.jsonl results/results_av.jsonl \
            --corpus data/corpus.jsonl \
            --outdir /tmp/figs \
            --replication results/results_p1.jsonl results/results_p2.jsonl
          test "$(ls /tmp/figs/figs/*.pdf | wc -l)" = "5" \
            || { echo "expected 5 vector figures"; ls /tmp/figs/figs; exit 1; }
          echo "5 figures regenerated"

  verify-without-dependencies:
    # The three checks are the reason the numbers can be trusted, so they should
    # not depend on anything a reader has to install first. They are computed
    # from the committed JSONL with the standard library alone; only the figures
    # need matplotlib, and `make verify` skips those.
    #
    # This job exists because the check above installs matplotlib, which hid the
    # fact that `make verify` failed with ModuleNotFoundError on a clean clone.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Nothing is installed beyond the interpreter
        run: |
          python -c "import matplotlib" 2>/dev/null && {
            echo "matplotlib is present; this job is meant to prove it is not needed"
            exit 1
          }
          echo "confirmed: no third-party packages available"
      - name: make verify
        run: make verify
